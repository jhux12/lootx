    <style>
      html, body {
        overflow-x: hidden;
      }
      body {
        background-color: #0b0e14;
        color: white;
      }
      /* Custom scrollbar for chat */
      .scrollbar-thin::-webkit-scrollbar {
        width: 6px;
      }
      .scrollbar-thin::-webkit-scrollbar-track {
        background: #151a23;
      }
      .scrollbar-thin::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 3px;
      }
      .scrollbar-thin::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }
      .category-scrollbar {
        scrollbar-width: none;
        scrollbar-gutter: stable both-edges;
        -webkit-overflow-scrolling: auto;
      }
      .category-scrollbar::-webkit-scrollbar {
        height: 0;
      }
      .category-scrollbar-indicator {
        margin-top: 6px;
        height: 6px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.6);
        position: relative;
        overflow: hidden;
        pointer-events: none;
      }
      .category-scrollbar-indicator__thumb {
        position: absolute;
        inset: 0 auto 0 0;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, rgba(124, 58, 237, 0.95), rgba(99, 102, 241, 0.95));
        box-shadow: 0 0 8px rgba(124, 58, 237, 0.45);
        transition: transform 150ms ease-out;
      }
      .ticker-animation {
        animation: scroll 35s linear infinite;
      }
      .btn-logo-gradient {
        background: linear-gradient(120deg, #7c3aed 0%, #6366f1 45%, #38bdf8 100%);
        box-shadow: 0 16px 30px rgba(88, 80, 236, 0.35);
      }
      .btn-logo-gradient:hover {
        background: linear-gradient(120deg, #8b5cf6 0%, #7c3aed 45%, #4fd1ff 100%);
      }
      .btn-logo-gradient:active {
        box-shadow: 0 10px 20px rgba(88, 80, 236, 0.3);
      }
      @keyframes scroll {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }

      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #334155;
      }
      @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
    </style>
