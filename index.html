<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LootX - Mystery Boxes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              brand: {
                dark: '#0f172a',
                purple: '#8b5cf6',
                green: '#22c55e',
                bg: '#0b0e14',
                card: '#151a23',
                accent: '#6366f1'
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0b0e14;
        color: white;
      }
      /* Custom scrollbar for chat */
      .scrollbar-thin::-webkit-scrollbar {
        width: 6px;
      }
      .scrollbar-thin::-webkit-scrollbar-track {
        background: #151a23;
      }
      .scrollbar-thin::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 3px;
      }
      .scrollbar-thin::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }
      .ticker-animation {
        animation: scroll 20s linear infinite;
      }
      @keyframes scroll {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      /* Logo Animation */
      @keyframes loot-reveal {
        0% { transform: scale(1); filter: brightness(100%); }
        10% { transform: scale(0.9) rotate(-3deg); }
        20% { transform: scale(0.9) rotate(3deg); }
        30% { transform: scale(0.9) rotate(-3deg); }
        40% { transform: scale(1.2); filter: brightness(200%) drop-shadow(0 0 10px #8b5cf6); }
        50% { transform: scale(1.5) rotate(0deg); filter: brightness(150%) hue-rotate(180deg) drop-shadow(0 0 20px #ec4899); }
        60% { transform: scale(1.3); filter: hue-rotate(90deg); }
        80% { transform: scale(1.1); filter: brightness(110%); }
        100% { transform: scale(1); filter: brightness(100%); }
      }
      .animate-loot-reveal {
        animation: loot-reveal 2s cubic-bezier(0.34, 1.56, 0.64, 1);
        display: inline-block;
      }
      @media (prefers-reduced-motion: reduce) {
        .animate-loot-reveal {
          animation: none;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",

    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "firebase/": "https://esm.sh/firebase@10.12.2/"
  }
}
</script>
    <script type="module" src="/index.tsx"></script>
</head>

    <div id="root"></div>
  </body>
</html>
